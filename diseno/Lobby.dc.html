<section style="background: #191C38; border: 2px solid #C6F432; border-radius: 24px; padding: 40px; display: flex; flex-direction: column; align-items: flex-start; gap: 18px; animation: fadeUp 0.55s ease 0.15s both, cardGlow 3.2s ease-in-out 0.8s infinite">
<div style="font-size: 13px; font-weight: 600; letter-spacing: 0.12em; color: #C6F432">TU MISIÓN DE HOY · +150 XP</div>
<h1 style="margin: 0; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: clamp(34px, 5vw, 52px); line-height: 1.05">Sube tu poder de Datos y azar</h1>
